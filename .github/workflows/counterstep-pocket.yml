name: Counterstep Pocket native prototype
on:
  push:
    branches: [spike/counterstep-pocket]
    paths: [.github/workflows/counterstep-pocket.yml, pocket-build/**]
permissions:
  contents: write
concurrency:
  group: counterstep-pocket-prototype
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/spike/counterstep-pocket'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Create only the isolated native source
        run: |
          python3 pocket-build/create_project.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pocket/app/src/main/java/dev/joseph/countersteppocket/MainActivity.kt')
          s=p.read_text().replace('Example format: 2x + 6','Write the expanded terms')
          assert 'Example format: 2x + 6' not in s
          p.write_text(s)
          PY
      - name: Build APK and execute focused JVM checks
        run: |
          set -o pipefail
          mkdir -p out
          cd pocket
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee ../out/build.log
      - name: Package actual build and scoped code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile,xml.etree.ElementTree as ET
          out=Path('out');apk=Path('pocket/app/build/outputs/apk/debug/app-debug.apk');assert apk.is_file()
          reports=list(Path('pocket/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'));assert reports
          totals={'tests':0,'failures':0,'errors':0,'skipped':0}
          for f in reports:
            root=ET.parse(f).getroot()
            for k in totals:totals[k]+=int(root.attrib.get(k,0))
          assert totals['tests']==28 and totals['failures']==0 and totals['errors']==0,totals
          (out/'Counterstep-Pocket-prototype.apk').write_bytes(apk.read_bytes())
          with zipfile.ZipFile(out/'Counterstep-Pocket-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('pocket').rglob('*'):
              if p.is_file() and 'build' not in p.parts and '.gradle' not in p.parts and p.name!='local.properties':z.write(p,p.as_posix())
          (out/'verification.json').write_text(json.dumps({'status':'passed','native_android_apk_compiled':True,'jvm_tests':totals,'revenuecat_sdk_dependency':'9.9.0','test_store_configured':False,'provider_requests':0,'purchase_executed':False,'device_ui_tested':False,'registration_submitted':False,'existing_competition_entries_changed':False,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'scope':'Native prototype compile and focused JVM logic/state tests. No end-to-end SDK transaction, Android device validation or student eligibility claim.'},indent=2))
          PY
          git config user.name 'Counterstep Pocket Build'
          git config user.email 'counterstep-pocket@users.noreply.github.com'
          git add pocket/
          if ! git diff --cached --quiet; then
            git commit -m 'feat(pocket): preserve compiled native prototype source'
            git push origin HEAD:spike/counterstep-pocket
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-pocket-prototype
          path: |
            out/
            pocket/app/build/test-results/
          retention-days: 14
          if-no-files-found: error
