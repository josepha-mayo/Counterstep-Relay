name: Relay Repair Desk public verification
on:
  push:
    branches: [relay-desk-final-20260908]
    paths: [DESK_PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: relay-desk-public-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/relay-desk-final-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install anonymous browser and media checker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/relay-desk-public
          /tmp/relay-desk-public/bin/pip -q install playwright==1.55.0
          /tmp/relay-desk-public/bin/python -m playwright install --with-deps chromium
      - name: Verify the served implementation, actual MCP workflows, source and video
        run: /tmp/relay-desk-public/bin/python tools/desk_public_check.py
      - name: Preserve exact public-origin evidence
        if: always()
        run: |
          git config user.name 'Relay Public Verification'
          git config user.email 'relay-build@users.noreply.github.com'
          git add evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record anonymous Repair Desk workflow and media checks'
          git push origin HEAD:relay-desk-final-20260908
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-desk-public-evidence
          path: evidence/
          retention-days: 14
