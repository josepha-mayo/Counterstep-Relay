name: Verify processed entry thumbnail
on:
  push:
    branches: [master]
    paths: [.github/workflows/entry-media-check.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'josepha-mayo/Counterstep-Relay'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch and verify the corrected public thumbnail
        run: |
          python3 -m venv /tmp/media-check
          /tmp/media-check/bin/pip -q install pillow==11.3.0
          /tmp/media-check/bin/python - <<'PY'
          from pathlib import Path
          import urllib.request, json, hashlib
          from PIL import Image
          out=Path('media-check');out.mkdir()
          url='https://d112y698adiu2z.cloudfront.net/photos/production/software_thumbnail_photos/005/279/189/datas/medium.png'
          with urllib.request.urlopen(url,timeout=30) as r:
              data=r.read();status=r.status
          p=out/'thumbnail.png';p.write_bytes(data)
          with Image.open(p) as im:
              im.load();rgb=im.convert('RGB');dim=rgb.size
              pixel_hash=hashlib.sha256(rgb.tobytes()).hexdigest()
              rgb.save(out/'thumbnail-decoded.png')
          expected='1e40a64bc37136a5cfc5070cece8e94fd3df6d9a8b13907340ddda16c3f65bec'
          result={'http_status':status,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'dimensions':dim,'decoded':True,'pixel_sha256':pixel_hash,'matches_reviewed_wordmark':pixel_hash==expected}
          (out/'result.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          assert status==200 and dim==(333,222) and pixel_hash==expected
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-thumbnail-check
          path: media-check/
          retention-days: 7
