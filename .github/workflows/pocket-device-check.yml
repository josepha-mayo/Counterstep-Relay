name: Counterstep Pocket Android device checks
on:
  push:
    branches: [test/pocket-device-20260910]
    paths: [.github/workflows/pocket-device-check.yml, pocket/**]
permissions:
  contents: read
concurrency:
  group: counterstep-pocket-device
  cancel-in-progress: false
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Expose SDK and explicit AVD paths
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/pocket-avds" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/pocket-android" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/pocket-android" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pocket-avds" "$RUNNER_TEMP/pocket-android" device-out
      - name: Compile actual app, unit tests and instrumentation
        run: |
          set -o pipefail
          cd pocket
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee ../device-out/build.log
          cd ..
          python3 pocket/tools/device_release.py build
      - name: Boot native Android 15 emulator
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          timeout 240 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' > device-out/sdk.log 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n pocket-native -k 'system-images;android-35;google_apis;x86_64' --device pixel_2 -p "$ANDROID_AVD_HOME/pocket-native.avd" > device-out/avd-create.log 2>&1
          test -f "$ANDROID_AVD_HOME/pocket-native.ini"
          "$ANDROID_HOME/emulator/emulator" -accel-check > device-out/acceleration.log 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd pocket-native -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 2048 -cores 2 > device-out/emulator.log 2>&1 &
          echo $! > device-out/emulator.pid
          timeout 240 bash -c 'until [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$(cat device-out/emulator.pid)" || exit 2; sleep 3; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop > device-out/device-properties.txt
      - name: Exercise native UI and lifecycle without provider credentials
        run: |
          python3 pocket/tools/native_device.py
      - name: Save screenshots and verify real process restart
        run: |
          mkdir -p device-out/screens
          timeout 20 adb pull /sdcard/Android/data/dev.joseph.countersteppocket/files/device-evidence/ device-out/screens/
          python3 pocket/tools/device_release.py restart
          python3 pocket/tools/device_release.py finish
      - name: Preserve diagnostics and terminate emulator
        if: always()
        run: |
          mkdir -p device-out/screens
          timeout 12 adb pull /sdcard/Android/data/dev.joseph.countersteppocket/files/device-evidence/ device-out/screens/ || true
          timeout 12 adb logcat -d -s AndroidRuntime > device-out/crash-log.txt || true
          timeout 8 adb emu kill || true
          if [ -f device-out/emulator.pid ]; then kill "$(cat device-out/emulator.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-pocket-device-check
          path: |
            device-out/
            pocket/app/build/test-results/
            pocket/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: error
