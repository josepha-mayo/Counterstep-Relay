name: Counterstep Pocket Android device checks
on:
  push:
    branches: [test/pocket-device-20260910]
    paths: [.github/workflows/pocket-device-check.yml, pocket/**]
permissions:
  contents: read
concurrency:
  group: counterstep-pocket-device
  cancel-in-progress: true
jobs:
  device:
    if: github.ref == 'refs/heads/test/pocket-device-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Expose Android SDK tools
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Build actual application and instrumentation APKs
        run: |
          set -o pipefail
          mkdir -p device-out
          cd pocket
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee ../device-out/build.log
      - name: Boot a bounded native Android 15 emulator
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          timeout 240 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' > device-out/sdk.log 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pocket-native -k 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -accel-check > device-out/acceleration.log 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd pocket-native -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > device-out/emulator.log 2>&1 &
          echo $! > device-out/emulator.pid
          set +e
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          boot_status=$?
          set -e
          if [ "$boot_status" != 0 ]; then tail -100 device-out/emulator.log; exit "$boot_status"; fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop > device-out/device-properties.txt
      - name: Exercise actual Android UI and lifecycle
        run: |
          set -o pipefail
          cd pocket
          gradle --no-daemon :app:connectedDebugAndroidTest 2>&1 | tee ../device-out/instrumentation.log
      - name: Preserve captures before process-restart data reset
        run: |
          mkdir -p device-out/screens
          timeout 15 adb pull /sdcard/Android/data/dev.joseph.countersteppocket/files/device-evidence/ device-out/screens/
      - name: Verify persistence across an actual process stop
        run: |
          python3 - <<'PY'
          import subprocess,time,xml.etree.ElementTree as ET,re,json
          from pathlib import Path
          def adb(*args):return subprocess.check_output(['adb',*args],text=True,timeout=20)
          pkg='dev.joseph.countersteppocket'
          adb('shell','pm','clear',pkg)
          adb('shell','am','start','-W','-n',pkg+'/.MainActivity')
          time.sleep(1)
          def tree():
            adb('shell','uiautomator','dump','/sdcard/pocket-ui.xml')
            return ET.fromstring(adb('shell','cat','/sdcard/pocket-ui.xml'))
          node=next(n for n in tree().iter('node') if n.attrib.get('class')=='android.widget.EditText')
          x1,y1,x2,y2=map(int,re.findall(r'\d+',node.attrib['bounds']))
          adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2))
          adb('shell','input','text','2x+')
          adb('shell','input','keyevent','4')
          time.sleep(.5)
          assert any(n.attrib.get('text')=='2x+' for n in tree().iter('node'))
          oldpid=adb('shell','pidof',pkg).strip();assert oldpid
          adb('shell','am','force-stop',pkg)
          adb('shell','am','start','-W','-n',pkg+'/.MainActivity')
          time.sleep(.5)
          newpid=adb('shell','pidof',pkg).strip();assert newpid and newpid!=oldpid
          after=tree();assert any(n.attrib.get('text')=='2x+' for n in after.iter('node'))
          assert any(n.attrib.get('text')=='No response yet.' for n in after.iter('node'))
          Path('device-out/process-restart.json').write_text(json.dumps({'status':'passed','old_process':oldpid,'new_process':newpid,'draft_preserved':'2x+','no_attempt_invented':True},indent=2))
          Path('device-out/restarted-ui.xml').write_bytes(ET.tostring(after))
          Path('device-out/restarted-screen.png').write_bytes(subprocess.check_output(['adb','exec-out','screencap','-p'],timeout=20))
          PY
      - name: Package actual outcomes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,xml.etree.ElementTree as ET,zipfile,os
          out=Path('device-out')
          def totals(root):
            files=list(Path(root).rglob('TEST-*.xml'));assert files,root
            counts={'tests':0,'failures':0,'errors':0,'skipped':0}
            for f in files:
              t=ET.parse(f).getroot()
              for k in counts:counts[k]+=int(t.attrib.get(k,0))
            assert not any(counts[k] for k in ['failures','errors','skipped']),counts
            return counts
          jvm=totals('pocket/app/build/test-results/testDebugUnitTest');device=totals('pocket/app/build/outputs/androidTest-results/connected')
          assert jvm['tests']==28 and device['tests']==14,(jvm,device)
          apk=Path('pocket/app/build/outputs/apk/debug/app-debug.apk');shutil.copy2(apk,out/'Counterstep-Pocket-device-tested.apk')
          with zipfile.ZipFile(out/'Counterstep-Pocket-device-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('pocket').rglob('*'):
              if p.is_file() and 'build' not in p.parts and '.gradle' not in p.parts and p.name!='local.properties' and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.ttc'}:z.write(p,p.as_posix())
          (out/'verification.json').write_text(json.dumps({'status':'passed','source_commit':os.environ['GITHUB_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],'jvm_tests':jvm,'android_instrumented_tests':device,'process_restart':json.loads((out/'process-restart.json').read_text()),'android_api':35,'device':'Android emulator, not physical Redmi hardware','test_store_configured':False,'purchase_executed':False,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'scope':'Actual Android UI/lifecycle and free-workflow checks. Share intent intercepted, not sent. No credential, sandbox transaction, entitlement expiry, physical-device or learning-outcome claim.'},indent=2))
          PY
      - name: Retain diagnostic evidence and terminate emulator
        if: always()
        run: |
          mkdir -p device-out/screens
          timeout 12 adb pull /sdcard/Android/data/dev.joseph.countersteppocket/files/device-evidence/ device-out/screens/ || true
          timeout 12 adb logcat -d -s AndroidRuntime > device-out/crash-log.txt || true
          timeout 8 adb emu kill || true
          if [ -f device-out/emulator.pid ]; then kill "$(cat device-out/emulator.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-pocket-device-check
          path: |
            device-out/
            pocket/app/build/test-results/
            pocket/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: error
